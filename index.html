<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APA · Weekly Status Reports</title>
<style>
  :root {
    --paper:#f4f2ec; --ink:#23211c; --mut:#76726a;
    --accent:#534AB7; --line:#dcd8cc; --card:#fffefb;
    --danger:#c0392b; --success:#27ae60;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 18% 0%,rgba(83,74,183,.05),transparent 42%);
    min-height:100vh;
  }

  /* ── Login Screen ── */
  .login-overlay{
    position:fixed;inset:0;z-index:1000;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    background-image:radial-gradient(circle at 30% 20%,rgba(83,74,183,.08),transparent 50%);
  }
  .login-overlay.hidden{display:none}
  .login-box{
    background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:48px 40px;width:100%;max-width:380px;
    box-shadow:0 8px 40px rgba(0,0,0,.06);
  }
  .login-box .logo{font-size:15px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:8px}
  .login-box h2{font-family:Georgia,serif;font-size:28px;margin-bottom:28px}
  .login-box label{display:block;font-size:13px;font-weight:600;
    letter-spacing:.04em;color:var(--mut);margin-bottom:6px;margin-top:18px}
  .login-box input{
    width:100%;padding:10px 14px;border:1px solid var(--line);
    border-radius:8px;font-size:15px;background:var(--paper);
    transition:border-color .2s;
  }
  .login-box input:focus{outline:none;border-color:var(--accent)}
  .login-box button{
    margin-top:28px;width:100%;padding:12px;border:none;
    border-radius:8px;background:var(--accent);color:#fff;
    font-size:15px;font-weight:600;cursor:pointer;
    transition:opacity .2s;
  }
  .login-box button:hover{opacity:.88}
  .login-error{color:var(--danger);font-size:13px;margin-top:12px;display:none}

  /* ── Main App ── */
  .app{display:none}
  .app.visible{display:block}
  .wrap{max-width:760px;margin:0 auto;padding:48px 24px 90px}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .kicker{font-size:17px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  .logout-btn{
    background:none;border:1px solid var(--line);border-radius:6px;
    padding:6px 14px;font-size:13px;color:var(--mut);cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .logout-btn:hover{border-color:var(--accent);color:var(--accent)}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;
    font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-.015em}
  h1 em{font-style:italic;color:var(--accent)}

  /* ── Search ── */
  .search-wrap{margin-top:24px;position:relative}
  .search-wrap input{
    width:100%;padding:12px 16px 12px 42px;border:1px solid var(--line);
    border-radius:10px;font-size:15px;background:var(--card);
    transition:border-color .2s;
  }
  .search-wrap input:focus{outline:none;border-color:var(--accent)}
  .search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--mut);font-size:16px;pointer-events:none}
  .search-count{font-size:13px;color:var(--mut);margin-top:8px;letter-spacing:.03em}

  .rule{height:2px;background:var(--ink);margin:20px 0 6px;opacity:.85}

  /* ── Report List ── */
  .list{margin-top:16px;border-top:1px solid var(--line)}
  .entry{
    display:flex;align-items:baseline;gap:22px;
    padding:22px 12px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit;position:relative;
    transition:background .18s ease,padding-left .18s ease;
  }
  .entry:hover{background:var(--card);padding-left:22px}
  .entry .body{flex:1}
  .entry .date{font-size:13px;color:var(--mut);letter-spacing:.03em}
  .entry .title{font-family:Georgia,serif;font-size:20px;margin-top:3px;letter-spacing:-.01em}
  .entry .go{align-self:center;color:var(--mut);font-size:22px;transition:transform .18s,color .18s}
  .entry:hover .go{transform:translateX(5px);color:var(--accent)}
  .entry.latest .title::after{
    content:"Latest";font-family:-apple-system,sans-serif;font-size:10px;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px;
    margin-left:10px;vertical-align:middle;
  }

  /* ── Pagination ── */
  .pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:32px}
  .pager button{
    min-width:36px;height:36px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink);
    font-size:14px;cursor:pointer;transition:all .18s;
  }
  .pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .pager button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pager button:disabled{opacity:.35;cursor:default}

  .empty-msg{text-align:center;color:var(--mut);padding:48px 0;font-size:15px}

  @media(max-width:500px){
    .login-box{padding:36px 24px}
    .wrap{padding:32px 16px 60px}
  }
</style>
</head>
<body>

<!-- ════════════ LOGIN ════════════ -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="logo">APA · Reports</div>
    <h2>Sign in</h2>
    <form id="loginForm" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="login-error" id="loginError">Invalid username or password</div>
    </form>
  </div>
</div>

<!-- ════════════ APP ════════════ -->
<div class="app" id="app">
  <div class="wrap">
    <div class="top-bar">
      <div class="kicker">APA · Project Status</div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
    <h1>Weekly <em>Reports</em></h1>

    <div class="search-wrap">
      <span class="icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Search reports by title or date…">
    </div>
    <div class="search-count" id="searchCount"></div>

    <div class="rule"></div>
    <nav class="list" id="reportList"></nav>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
(function(){
  var CREDENTIALS_HASH = 'a9e355b217a8b6dd04c5696c6695008ef8cc6bc0ffd159919c5b198688709a2f';
  var SESSION_KEY = 'apa_session';
  var PER_PAGE = 10;

  var reports = [];
  var filtered = [];
  var currentPage = 1;

  async function sha256(str) {
    var buf = await crypto.subtle.digest('SHA-256',
      new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf))
      .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  function isLoggedIn() {
    return sessionStorage.getItem(SESSION_KEY) === CREDENTIALS_HASH;
  }

  function showApp() {
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('app').classList.add('visible');
  }

  function showLogin() {
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('app').classList.remove('visible');
    sessionStorage.removeItem(SESSION_KEY);
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var hash = await sha256(u + ':' + p);
    if (hash === CREDENTIALS_HASH) {
      sessionStorage.setItem(SESSION_KEY, hash);
      document.getElementById('loginError').style.display = 'none';
      showApp();
      loadReports();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    showLogin();
  });

  async function loadReports() {
    try {
      var resp = await fetch('reports.json?_=' + Date.now());
      reports = await resp.json();
      reports.sort(function(a, b) { return b.file.localeCompare(a.file); });
      applyFilter();
    } catch (e) {
      document.getElementById('reportList').innerHTML =
        '<div class="empty-msg">Could not load reports. Make sure <code>reports.json</code> exists.</div>';
    }
  }

  document.getElementById('searchInput').addEventListener('input', function() {
    currentPage = 1;
    applyFilter();
  });

  function applyFilter() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) {
      filtered = reports.slice();
    } else {
      filtered = reports.filter(function(r) {
        return r.title.toLowerCase().indexOf(q) !== -1 ||
               r.file.toLowerCase().indexOf(q) !== -1;
      });
    }
    var countEl = document.getElementById('searchCount');
    countEl.textContent = filtered.length + ' report' + (filtered.length !== 1 ? 's' : '') +
      (q ? ' matching "' + q + '"' : ' total');
    renderPage();
  }

  function renderPage() {
    var list = document.getElementById('reportList');
    var totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PER_PAGE;
    var page = filtered.slice(start, start + PER_PAGE);

    if (page.length === 0) {
      list.innerHTML = '<div class="empty-msg">No reports found.</div>';
    } else {
      list.innerHTML = page.map(function(r, i) {
        var isLatest = (start + i === 0) && currentPage === 1 &&
          document.getElementById('searchInput').value.trim() === '';
        return '<a class="entry' + (isLatest ? ' latest' : '') + '" href="reports/' + r.file + '">' +
          '<span class="body">' +
            '<span class="date">' + escHtml(r.date || r.file.replace('.html','')) + '</span>' +
            '<div class="title">' + escHtml(r.title) + '</div>' +
          '</span>' +
          '<span class="go">&rarr;</span>' +
        '</a>';
      }).join('');
    }

    renderPager(totalPages);
  }

  function renderPager(totalPages) {
    var pager = document.getElementById('pager');
    if (totalPages <= 1) { pager.innerHTML = ''; return; }
    var html = '';
    html += '<button' + (currentPage <= 1 ? ' disabled' : '') +
      ' data-page="' + (currentPage - 1) + '">&laquo;</button>';
    for (var p = 1; p <= totalPages; p++) {
      html += '<button class="' + (p === currentPage ? 'active' : '') +
        '" data-page="' + p + '">' + p + '</button>';
    }
    html += '<button' + (currentPage >= totalPages ? ' disabled' : '') +
      ' data-page="' + (currentPage + 1) + '">&raquo;</button>';
    pager.innerHTML = html;
    pager.querySelectorAll('button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var pg = parseInt(this.getAttribute('data-page'));
        if (pg >= 1 && pg <= totalPages) { currentPage = pg; renderPage(); }
      });
    });
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  if (isLoggedIn()) {
    showApp();
    loadReports();
  }
})();
</script>
</body>
</html>
