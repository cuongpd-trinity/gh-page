<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generate Credential Hash</title>
<style>
  body{font-family:system-ui;max-width:420px;margin:80px auto;padding:20px}
  label{display:block;margin-top:16px;font-weight:600;font-size:14px}
  input{width:100%;padding:8px 12px;margin-top:4px;border:1px solid #ccc;border-radius:6px;font-size:15px}
  button{margin-top:20px;padding:10px 20px;background:#534AB7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px}
  .result{margin-top:20px;padding:12px;background:#f0f0f0;border-radius:6px;word-break:break-all;font-family:monospace;font-size:13px}
</style>
</head>
<body>
<h2>Generate Credential Hash</h2>
<p>Enter the username and password, then copy the SHA-256 hash into <code>index.html</code>.</p>
<label>Username</label>
<input type="text" id="u">
<label>Password</label>
<input type="text" id="p">
<button onclick="gen()">Generate Hash</button>
<div class="result" id="out" style="display:none"></div>
<script>
async function gen(){
  var s = document.getElementById('u').value+':'+document.getElementById('p').value;
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  var hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  var el = document.getElementById('out');
  el.style.display='block';
  el.textContent = hex;
}
</script>
</body>
</html>
