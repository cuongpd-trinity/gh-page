name: Build reports manifest

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate reports.json
        run: |
          echo "[" > reports.json
          first=true
          for f in reports/*.html; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            title=$(grep -oP '(?<=<title>).*?(?=</title>)' "$f" | head -1)
            [ -z "$title" ] && title="$filename"
            date_part=$(echo "$filename" | sed 's/\.html$//')
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> reports.json
            fi
            printf '  {"file":"%s","title":"%s","date":"%s"}' \
              "$filename" "$title" "$date_part" >> reports.json
          done
          echo "" >> reports.json
          echo "]" >> reports.json
          cat reports.json

      - name: Commit reports.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update reports.json manifest"
          git push
